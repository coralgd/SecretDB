<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecretDB Console</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>SecretDB Console</h1>
      <p>Секретная локальная база с доступом по ключам и усиленной защитой.</p>
      <div class="toolbar">
        <label class="import-label">
          Импорт JSON
          <input id="import-input" type="file" accept="application/json" />
        </label>
      </div>
    </header>

    <section class="hud panel">
      <h2>Security HUD</h2>
      <div class="hud-grid">
        <div class="hud-item"><span>Баз:</span><strong id="hud-dbs">0</strong></div>
        <div class="hud-item"><span>Разделов:</span><strong id="hud-sections">0</strong></div>
        <div class="hud-item"><span>Защищённых:</span><strong id="hud-protected">0%</strong></div>
        <div class="hud-item"><span>Записей:</span><strong id="hud-entries">0</strong></div>
      </div>
      <div id="hud-status" class="selected-mark">Ожидание выбора раздела</div>
    </section>

    <main class="layout-grid">
      <section class="panel">
        <h2>Базы данных <span id="db-count" class="badge">0</span></h2>
        <form id="db-form" class="row-form">
          <input id="db-name" type="text" placeholder="Название базы" required />
          <input id="db-delete-key" type="password" placeholder="Ключ удаления базы" required />
          <button id="toggle-db-key" type="button" class="ghost">👁</button>
          <button type="submit">Создать базу</button>
        </form>
        <ul id="db-list" class="list"></ul>
      </section>

      <section class="panel">
        <h2>Разделы <span id="section-count" class="badge">0</span></h2>
        <div id="selected-db-name" class="selected-mark">База не выбрана</div>
        <form id="section-form" class="row-form">
          <input id="section-name" type="text" placeholder="Название раздела" required />
          <input id="section-key" type="password" placeholder="Ключ доступа (необязательно)" />
          <button id="toggle-section-key" type="button" class="ghost">👁</button>
          <button type="submit">Добавить раздел</button>
        </form>
        <ul id="section-list" class="list"></ul>
      </section>

      <section class="panel panel-wide">
        <h2>Содержимое раздела <span id="entry-count" class="badge">0</span></h2>
        <div id="section-lock" class="selected-mark">Выберите раздел</div>

        <form id="unlock-form" class="row-form inline hidden">
          <input id="unlock-key" type="password" placeholder="Введите ключ" required />
          <button id="toggle-unlock-key" type="button" class="ghost">👁</button>
          <button type="submit">Открыть</button>
        </form>

        <div class="entry-tools hidden" id="entry-tools">
          <input id="search-input" type="search" placeholder="Поиск по заголовку и содержимому" />
          <button id="clear-search-btn" type="button" class="ghost">✕</button>
          <button id="relock-btn" type="button" class="ghost">🔒</button>
          <button id="wipe-section-btn" type="button">Очистить раздел</button>
        </div>

        <div class="lock-settings hidden" id="lock-settings">
          <label><input id="auto-lock-enabled" type="checkbox" checked /> Авто-блокировка</label>
          <label>Таймер (сек): <input id="auto-lock-seconds" type="number" min="10" max="600" value="60" /></label>
          <span id="lock-countdown" class="badge">∞</span>
        </div>

        <form id="entry-form" class="stack-form hidden">
          <input id="entry-title" type="text" placeholder="Заголовок записи" required />
          <textarea id="entry-content" placeholder="Секретные данные" required></textarea>
          <button type="submit">Сохранить запись</button>
        </form>

        <ul id="entry-list" class="list"></ul>
      </section>
    </main>
  </div>

  <template id="item-template">
    <li class="item-row">
      <button class="item-select"></button>
      <button class="item-delete">Удалить</button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
